name: Test and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
      - name: Install ffmpeg
        run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
      - name: Mic detector on the sample recording, blips with the car stopped, and lap sounds
        run: |
          for sr in 48000 44100; do
            ffmpeg -loglevel error -i samples/13-laps.m4a -ac 1 -ar $sr -f f32le "$RUNNER_TEMP/laps-$sr.f32"
            node test/detector.test.js "$RUNNER_TEMP/laps-$sr.f32" $sr
            node test/blips.test.js "$RUNNER_TEMP/laps-$sr.f32" $sr
            node test/cues.test.js "$RUNNER_TEMP/laps-$sr.f32" $sr
          done
      - name: Camera lane watcher
        run: node test/lanes.test.js

  # Upload and deploy are separate jobs, as in GitHub's Pages starter
  # workflows. In one job, deploy-pages looked the artifact up less than a
  # second after the upload and GitHub didn't list it yet ("No artifacts named
  # github-pages were found"); it failed that way on two of three deploys.
  build:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v7
      - name: Collect the site files
        run: |
          mkdir _site
          cp index.html wiring.html detector.js lanes.js cues.js manifest.webmanifest icon-180.png icon-512.png _site/
          cp -r samples _site/
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
