name: Test and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
      - name: Install ffmpeg
        run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
      - name: Mic detector finds the 13 laps in the sample recording
        run: |
          for sr in 48000 44100; do
            ffmpeg -loglevel error -i samples/13-laps.m4a -ac 1 -ar $sr -f f32le "$RUNNER_TEMP/laps-$sr.f32"
            node test/detector.test.js "$RUNNER_TEMP/laps-$sr.f32" $sr
          done
      - name: Camera lane watcher
        run: node test/lanes.test.js

  deploy:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: Collect the site files
        run: |
          mkdir _site
          cp index.html detector.js lanes.js manifest.webmanifest icon-180.png icon-512.png _site/
          cp -r samples _site/
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
